name: Publish Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build metadata
        id: buildmeta
        shell: bash
        run: |
          echo "version=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.buildmeta.outputs.time }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published metadata
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          manifest=$(docker buildx imagetools inspect "$IMAGE" --raw)
          for platform in linux/amd64 linux/arm64; do
            # Classic Docker stores cannot associate both architectures with one index digest.
            digest=$(jq -er --arg arch "${platform#linux/}" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
              | if length == 1 then .[0].digest else error("expected exactly one platform manifest") end
            ' <<< "$manifest")
            platform_image="${IMAGE%@*}@$digest"
            docker pull --platform "$platform" "$platform_image"
            actual_platform=$(docker image inspect "$platform_image" --format '{{.Os}}/{{.Architecture}}')
            test "$actual_platform" = "$platform"
            revision=$(docker image inspect "$platform_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            test "$revision" = "$EXPECTED_SHA"
            output=$(docker run --rm --platform "$platform" --entrypoint /usr/local/bin/picoclaw "$platform_image" version)
            echo "$output"
            echo "$output" | grep -F "git: $EXPECTED_SHA"
            echo "$output" | grep -F 'go1.26.8'
            ! echo "$output" | grep -E 'git: (dev|unknown)|picoclaw dev'
          done
